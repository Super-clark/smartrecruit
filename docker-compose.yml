services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: smartrecruit_qdrant
    ports:
      - "6333:6333"   # REST API  (used by the app)
      - "6334:6334"   # gRPC      (optional, kept for completeness)
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes:
  qdrant_data:
