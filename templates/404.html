{% extends "base.html" %}
{% block title %}404 — Not Found | SmartRecruit{% endblock %}
{% block content %}
<div class="min-h-screen flex items-center justify-center px-6 text-center">
  <div>
    <p class="text-8xl font-black mb-4" style="color:#14b8a6;text-shadow:0 0 60px rgba(20,184,166,.3)">404</p>
    <h1 class="text-2xl font-bold text-white mb-2">Page not found</h1>
    <p class="text-sm font-mono mb-1" style="color:#64748b">{{ path }}</p>
    {% if detail %}<p class="text-sm mb-8" style="color:#475569">{{ detail }}</p>{% else %}<div class="mb-8"></div>{% endif %}
    <a href="/" class="btn-primary px-7 py-3 text-base rounded-xl">← Back to Home</a>
  </div>
</div>
{% endblock %}
