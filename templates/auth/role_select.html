{% extends "base.html" %}
{% block title %}Choose Account Type — SmartRecruit{% endblock %}
{% block content %}
<div class="min-h-screen flex items-center justify-center px-4 py-12">
  <div class="w-full max-w-lg">

    <div class="text-center mb-8">
      <div class="w-14 h-14 rounded-2xl flex items-center justify-center mx-auto mb-4"
           style="background:linear-gradient(135deg,#14b8a6,#0d9488)">
        <svg class="w-7 h-7 text-white" fill="currentColor" viewBox="0 0 24 24">
          <path d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/>
        </svg>
      </div>
      <h1 class="text-2xl font-extrabold mb-2" style="color:var(--text-white)">One last step</h1>
      <p class="text-sm" style="color:var(--text-muted)">How are you planning to use SmartRecruit?</p>
    </div>

    {% if error %}
    <div class="mb-4 px-4 py-3 rounded-xl text-sm" style="background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.25);color:#f87171">
      {{ error }}
    </div>
    {% endif %}

    <form method="post" action="/auth/google/role" class="space-y-4">
      <input type="hidden" name="role" id="role-input" value="CANDIDATE"/>

      <!-- Role cards -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <button type="button" onclick="pickRole('CANDIDATE')" id="card-candidate"
          class="text-left p-5 rounded-2xl border-2 transition-all"
          style="background:var(--bg-card);border-color:var(--teal)">
          <p class="text-3xl mb-3">👤</p>
          <p class="font-bold" style="color:var(--text-white)">Job Seeker</p>
          <p class="text-sm mt-1" style="color:var(--text-muted)">I'm looking for work and want to browse jobs and receive outreach from employers.</p>
        </button>
        <button type="button" onclick="pickRole('EMPLOYER')" id="card-employer"
          class="text-left p-5 rounded-2xl border-2 transition-all"
          style="background:var(--bg-card);border-color:var(--border)">
          <p class="text-3xl mb-3">🏢</p>
          <p class="font-bold" style="color:var(--text-white)">Employer</p>
          <p class="text-sm mt-1" style="color:var(--text-muted)">I'm hiring and want to search candidates, post jobs, and send outreach.</p>
        </button>
      </div>

      <!-- Conditional name/company field -->
      <div id="field-candidate" class="space-y-3">
        <div>
          <label class="block text-xs font-semibold mb-1" style="color:var(--text-muted)">Full Name *</label>
          <input type="text" name="full_name" placeholder="Jane Doe" maxlength="255"/>
        </div>
      </div>

      <div id="field-employer" class="space-y-3 hidden">
        <div>
          <label class="block text-xs font-semibold mb-1" style="color:var(--text-muted)">Company Name *</label>
          <input type="text" name="company_name" placeholder="Acme Corp (or your name if solo)" maxlength="255"/>
        </div>
      </div>

      <button type="submit" class="btn-primary w-full py-3 text-base">
        Continue →
      </button>
    </form>

  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
  function pickRole(r) {
    document.getElementById('role-input').value = r;
    const isCand = r === 'CANDIDATE';

    const cc = document.getElementById('card-candidate');
    const ce = document.getElementById('card-employer');
    cc.style.borderColor = isCand ? 'var(--teal)' : 'var(--border)';
    ce.style.borderColor = !isCand ? 'var(--teal)' : 'var(--border)';

    document.getElementById('field-candidate').classList.toggle('hidden', !isCand);
    document.getElementById('field-employer').classList.toggle('hidden', isCand);
  }
</script>
{% endblock %}
