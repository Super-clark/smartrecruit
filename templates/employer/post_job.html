{% extends "base.html" %}
{% block title %}Post a Job — SmartRecruit{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto px-4 py-8">
  <div class="flex items-center gap-3 mb-6">
    <a href="/dashboard/employer" class="text-slate-400 hover:text-white">← Dashboard</a>
    <span class="text-slate-700">/</span>
    <h1 class="text-2xl font-bold text-white">Post a New Job</h1>
  </div>

  {% if error %}<div class="mb-4 px-4 py-3 rounded-lg bg-red-500/10 border border-red-500/30 text-red-400 text-sm">{{ error }}</div>{% endif %}

  <div class="bg-slate-900 border border-slate-800 rounded-xl p-7">
    <form method="post" action="/employers/post-job" class="space-y-5">

      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1">Job Title *</label>
        <input type="text" name="title" required placeholder="e.g. Senior Backend Engineer"/>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1">Job Description *</label>
        <textarea name="description" rows="6" required placeholder="Describe the role, responsibilities, and what you're looking for…"></textarea>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1">Required Skills <span class="text-slate-600">(comma-separated)</span></label>
        <input type="text" name="skills_required" placeholder="Python, FastAPI, PostgreSQL, Docker…"/>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Minimum Experience (years)</label>
          <input type="number" name="experience_min" min="0" max="30" value="0"/>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Salary Range</label>
          <input type="text" name="salary_range" placeholder="e.g. $60k–$90k / year"/>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Job Type</label>
          <select name="job_type">
            <option value="">Any</option>
            {% for jt in ['FULL_TIME','PART_TIME','CONTRACT','FREELANCE','INTERNSHIP'] %}
            <option value="{{ jt }}">{{ jt.replace('_',' ').title() }}</option>
            {% endfor %}
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Work Mode</label>
          <select name="work_mode">
            <option value="">Any</option>
            {% for wm in ['ONSITE','REMOTE','HYBRID'] %}
            <option value="{{ wm }}">{{ wm.title() }}</option>
            {% endfor %}
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Location</label>
          <input type="text" name="location" placeholder="City, Country or Remote"/>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Industry</label>
          <input type="text" name="industry" placeholder="Technology, Finance…"/>
        </div>
      </div>

      <div class="pt-2 border-t border-slate-800 flex gap-3">
        <button type="submit" class="btn-primary flex-1 py-3 text-base">Publish Job Post</button>
        <a href="/dashboard/employer" class="btn-secondary flex-1 py-3 text-base text-center">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
